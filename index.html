<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASS Révisions V2.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#0f172a;color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh}aside h2{margin:5px 8px 20px}nav{display:grid;gap:6px}button{font:inherit;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}nav button{background:#1e293b;color:#cbd5e1;text-align:left}nav button:hover{color:#fff}main{padding:18px}.panel{display:none}.panel.on{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:14px}.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{border:1px solid #e5e7eb;border-radius:11px;padding:7px;min-height:160px;background:#fff;font-size:11px}.task{border-left:4px solid #2563eb;background:#f8fafc;padding:7px;border-radius:8px;margin:6px 0}.done{opacity:.5;text-decoration:line-through}.row{display:flex;gap:7px;flex-wrap:wrap}.primary{background:#2563eb;color:#fff}.soft{background:#eef2ff;color:#3730a3}.ok{background:#dcfce7;color:#166534}input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:9px;font:inherit}label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:12px}.badge{padding:4px 7px;border-radius:999px;font-weight:800;font-size:11px}.red{background:#fee2e2}.orange{background:#ffedd5}.yellow{background:#fef9c3}.green{background:#dcfce7}.blue{background:#cffafe}
@media(max-width:700px){.app{grid-template-columns:150px 1fr}.week{grid-template-columns:repeat(7,130px);overflow-x:auto}.g2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><h2>PASS<br><small>Révisions V2.1</small></h2><nav>
<button onclick="show('today')">Aujourd’hui</button><button onclick="show('week')">Semaine</button><button onclick="show('courses')">Cours</button><button onclick="show('subjects')">Suivi matières</button><button onclick="show('settings')">Réglages</button></nav></aside><main>
<section id="today" class="panel on"><h1>Aujourd’hui</h1><div class="card" id="todayList"></div></section>
<section id="week" class="panel"><h1>Semaine</h1><div class="week" id="weekGrid"></div></section>
<section id="courses" class="panel"><h1>Cours</h1><div class="grid g2"><div class="card"><h2>Ajouter</h2><label>Matière</label><select id="sub"></select><label>Titre</label><input id="title"><label>Date J0</label><input id="j0" type="date"><button class="primary" onclick="addCourse()" style="margin-top:10px">Ajouter</button></div><div class="card"><h2>Mes cours</h2><div id="coursesList"></div></div></div></section>
<section id="subjects" class="panel"><h1>Suivi matières</h1><div class="card"><div class="row" id="tabs"></div><div id="tracking"></div></div></section>
<section id="settings" class="panel"><h1>Réglages</h1><div class="grid g2"><div class="card"><h2>Général</h2><label>Charge max/jour (h)</label><input id="maxh" type="number" step=".5"><h3>Seuils QCM — moyenne des 3 dernières séances</h3><label>Rouge si inférieur à</label><input id="r1" type="number"><label>Orange si inférieur à</label><input id="r2" type="number"><label>Jaune si inférieur à</label><input id="r3" type="number"><label>Vert si inférieur à</label><input id="r4" type="number"><p><small>Au-dessus du seuil vert = bleu.</small></p><button class="primary" onclick="saveSettings()">Enregistrer</button></div><div class="card"><h2>Durées par matière</h2><div id="durations"></div></div></div></section>
</main></div><script>
const base=["Biologie cellulaire","Biophysique","Biochimie","Anatomie","Histologie","Chimie","Physiologie"], J=[0,2,7,14,30,60,90];
let old=JSON.parse(localStorage.getItem("passv2")||"null");let data=old||{subjects:base,courses:[]};data.subjects=data.subjects||base;data.settings=data.settings||{max:10,r1:50,r2:65,r3:80,r4:95};data.durations=data.durations||Object.fromEntries(data.subjects.map(s=>[s,{j0:1.5,j2:2,q:1}]));let active=data.subjects[0];
function save(){localStorage.setItem("passv2",JSON.stringify(data));render()}function iso(d){return new Date(d).toISOString().slice(0,10)}function today(){return iso(new Date())}function addDays(s,n){let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}function show(id){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on")}
function addCourse(){if(!title.value.trim())return;let d=j0.value||today();data.courses.push({id:crypto.randomUUID(),subject:sub.value,title:title.value.trim(),j0:d,sessions:J.map(j=>({id:crypto.randomUUID(),label:"J"+j,date:addDays(d,j),done:false,qcmTotal:0,qcmCorrect:0,type:"base"}))});title.value="";save()}
function addSession(cid){let c=data.courses.find(x=>x.id===cid);let type=prompt("Type : QCM / Annales / Relecture / Révision ciblée / Apprentissage","QCM");if(!type)return;let date=prompt("Date AAAA-MM-JJ",today());if(!date)return;let isQ=type.toLowerCase().includes("qcm");if(isQ&&date<addDays(c.j0,7))return alert("Les séances QCM commencent à J7. Choisis une date à partir de "+addDays(c.j0,7));c.sessions.push({id:crypto.randomUUID(),label:type,date,done:false,qcmTotal:0,qcmCorrect:0,type:"extra"});save()}
function toggle(cid,sid){let c=data.courses.find(x=>x.id===cid),s=c.sessions.find(x=>x.id===sid);s.done=!s.done;save()}
function score(cid,sid){let c=data.courses.find(x=>x.id===cid),s=c.sessions.find(x=>x.id===sid);let official=/^J\d+$/.test(s.label)?Number(s.label.slice(1)):null;if(official!==null&&official<7)return alert("La saisie QCM commence à J7.");if(s.date<addDays(c.j0,7))return alert("Ce cours n'est pas encore à J7.");let n=Number(prompt("Combien de QCM as-tu faits ?",s.qcmTotal||5));if(!n)return;let good=Number(prompt("Combien as-tu réussi ?",s.qcmCorrect||0));s.qcmTotal=n;s.qcmCorrect=Math.min(n,Math.max(0,good||0));save()}
function lev(c){if(c.manual)return c.manual;let a=c.sessions.filter(s=>s.qcmTotal>0).slice(-3).map(s=>100*s.qcmCorrect/s.qcmTotal);if(!a.length)return"orange";let x=a.reduce((p,q)=>p+q,0)/a.length,s=data.settings;if(x<s.r1)return"red";if(x<s.r2)return"orange";if(x<s.r3)return"yellow";if(x<s.r4)return"green";return"blue"}function setLev(id,v){data.courses.find(c=>c.id===id).manual=v||null;save()}
function saveSettings(){let v=[+r1.value,+r2.value,+r3.value,+r4.value];if(!(v[0]<v[1]&&v[1]<v[2]&&v[2]<v[3]&&v[3]<=100))return alert("Les seuils doivent être croissants.");data.settings={max:+maxh.value||10,r1:v[0],r2:v[1],r3:v[2],r4:v[3]};save()}function setDur(s,k,v){data.durations[s][k]=+v;save()}
function render(){sub.innerHTML=data.subjects.map(s=>`<option>${s}</option>`).join("");if(!j0.value)j0.value=today();maxh.value=data.settings.max;r1.value=data.settings.r1;r2.value=data.settings.r2;r3.value=data.settings.r3;r4.value=data.settings.r4;
let t=[];data.courses.forEach(c=>c.sessions.forEach(s=>{if(s.date===today())t.push({c,s})}));todayList.innerHTML=t.length?t.map(({c,s})=>`<div class="task ${s.done?"done":""}"><b>${c.title}</b> — ${c.subject}<br>${s.label}<div class="row"><button class="ok" onclick="toggle('${c.id}','${s.id}')">${s.done?"Réouvrir":"✓ Fait"}</button>${((s.label==="J0"||s.label==="J2")?"":`<button class="soft" onclick="score('${c.id}','${s.id}')">Entrer QCM</button>`)}<button onclick="addSession('${c.id}')">+ séance</button></div></div>`).join(""):"Aucune tâche aujourd’hui.";
let d=new Date(),dif=d.getDay()===0?-6:1-d.getDay(),m=new Date(d);m.setDate(d.getDate()+dif);let dates=Array.from({length:7},(_,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);return iso(x)});weekGrid.innerHTML=dates.map(ds=>{let a=[];data.courses.forEach(c=>c.sessions.forEach(s=>{if(s.date===ds)a.push({c,s})}));return`<div class="day"><b>${new Date(ds+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"})}</b>${a.map(x=>`<div class="task ${x.s.done?"done":""}"><b>${x.c.title}</b><br>${x.s.label}</div>`).join("")||"<p>—</p>"}</div>`}).join("");
coursesList.innerHTML=data.courses.map(c=>`<div class="task"><b>${c.title}</b> — ${c.subject}<div><button onclick="addSession('${c.id}')">+ séance illimitée</button></div></div>`).join("")||"Aucun cours.";
tabs.innerHTML=data.subjects.map(s=>`<button class="${s===active?"primary":"soft"}" onclick="active='${s}';render()">${s}</button>`).join("");let cs=data.courses.filter(c=>c.subject===active);tracking.innerHTML=`<table><tr><th>Niveau</th><th>Cours</th><th>Derniers QCM</th><th>Séances</th><th>Action</th></tr>${cs.map(c=>{let q=c.sessions.filter(s=>s.qcmTotal>0),last=q.at(-1),l=lev(c);return`<tr><td><span class="badge ${l}">${l}</span></td><td><b>${c.title}</b></td><td>${last?last.qcmCorrect+"/"+last.qcmTotal+" ("+Math.round(100*last.qcmCorrect/last.qcmTotal)+"%)":"—"}</td><td>${c.sessions.filter(s=>s.done).length}/${c.sessions.length}</td><td><button onclick="addSession('${c.id}')">+ séance</button><select onchange="setLev('${c.id}',this.value)"><option value="">Auto</option><option>red</option><option>orange</option><option>yellow</option><option>green</option><option>blue</option></select></td></tr>`}).join("")}</table>`;
durations.innerHTML=`<table><tr><th>Matière</th><th>J0</th><th>J2</th><th>J7+</th></tr>${data.subjects.map(s=>{let x=data.durations[s]||{j0:1.5,j2:2,q:1};data.durations[s]=x;return`<tr><td>${s}</td><td><input type="number" step=".25" value="${x.j0}" onchange="setDur('${s}','j0',this.value)"></td><td><input type="number" step=".25" value="${x.j2}" onchange="setDur('${s}','j2',this.value)"></td><td><input type="number" step=".25" value="${x.q}" onchange="setDur('${s}','q',this.value)"></td></tr>`}).join("")}</table>`}render();
</script></body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PASS Révisions V2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#172033}
header{background:#0f172a;color:white;padding:18px}
main{padding:18px;max-width:1200px;margin:auto}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}.secondary{background:#eef2ff;color:#3730a3}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g7{grid-template-columns:repeat(7,1fr)}
.day{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:8px;min-height:180px}
.task{border-left:4px solid #2563eb;background:#f8fafc;padding:8px;border-radius:8px;margin:6px 0;font-size:12px}
.done{opacity:.55;text-decoration:line-through}
.red{background:#fee2e2}.orange{background:#ffedd5}.yellow{background:#fef9c3}.green{background:#dcfce7}.blue{background:#cffafe}
.badge{padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:9px;border:1px solid #d1d5db;border-radius:9px;width:100%}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:left}
@media(max-width:900px){.g7{grid-template-columns:repeat(7,minmax(110px,1fr));overflow-x:auto}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>PASS Révisions V2</h1><div>J0 • J2 • J7 • J14 • J30 • J60 • J90 + séances illimitées</div></header>
<main>
<div class="card">
  <div class="row">
    <button class="primary" onclick="show('today')">Aujourd’hui</button>
    <button class="secondary" onclick="show('week')">Semaine</button>
    <button class="secondary" onclick="show('courses')">Cours</button>
    <button class="secondary" onclick="show('subjects')">Suivi matières</button>
  </div>
</div>

<section id="today">
  <div class="card"><h2>Aujourd’hui</h2><div id="todayList"></div></div>
</section>

<section id="week" style="display:none">
  <div class="card"><h2>Semaine complète</h2><div id="weekGrid" class="grid g7"></div></div>
</section>

<section id="courses" style="display:none">
  <div class="grid g2">
    <div class="card">
      <h2>Ajouter un cours</h2>
      <label>Matière</label><select id="subject"></select>
      <label>Titre</label><input id="title" placeholder="Ex. Potentiel de membrane">
      <label>Date J0</label><input id="j0" type="date">
      <button class="primary" onclick="addCourse()">Ajouter</button>
    </div>
    <div class="card">
      <h2>Mes cours</h2>
      <div id="courseList"></div>
    </div>
  </div>
</section>

<section id="subjects" style="display:none">
  <div class="card">
    <h2>Suivi par matière</h2>
    <div id="subjectTabs" class="row"></div>
    <div id="subjectTable"></div>
  </div>
</section>
</main>

<script>
const baseSubjects=["Biologie cellulaire","Biophysique","Biochimie","Anatomie","Histologie","Chimie","Physiologie"];
const js=[0,2,7,14,30,60,90];
let data=JSON.parse(localStorage.getItem("passv2")||"null")||{subjects:baseSubjects,courses:[]};
let activeSubject=data.subjects[0];

function save(){localStorage.setItem("passv2",JSON.stringify(data));render()}
function iso(d){return new Date(d).toISOString().slice(0,10)}
function addDays(ds,n){let d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function today(){return iso(new Date())}
function show(id){["today","week","courses","subjects"].forEach(x=>document.getElementById(x).style.display=x===id?"block":"none")}
function addCourse(){
  const t=title.value.trim(); if(!t) return;
  const d=j0.value||today();
  data.courses.push({id:crypto.randomUUID(),subject:subject.value,title:t,j0:d,manual:null,sessions:js.map(j=>({id:crypto.randomUUID(),label:"J"+j,date:addDays(d,j),done:false,qcmTotal:0,qcmCorrect:0,type:j<7?"base":"qcm"}))});
  title.value=""; save()
}
function addSession(cid){
  const c=data.courses.find(x=>x.id===cid);
  const type=prompt("Type de séance : QCM / Annales / Relecture / Révision ciblée / Apprentissage","QCM");
  if(!type)return;
  const date=prompt("Date AAAA-MM-JJ",today()); if(!date)return;
  const dur=prompt("Durée en heures","1");
  c.sessions.push({id:crypto.randomUUID(),label:type,date,done:false,qcmTotal:0,qcmCorrect:0,type:"extra",duration:Number(dur)||1});
  save()
}
function toggle(cid,sid){const c=data.courses.find(x=>x.id===cid),s=c.sessions.find(x=>x.id===sid);s.done=!s.done;save()}
function score(cid,sid){
  const c=data.courses.find(x=>x.id===cid),s=c.sessions.find(x=>x.id===sid);
  const total=Number(prompt("Nombre de QCM faits",s.qcmTotal||5)); if(!total)return;
  const good=Number(prompt("Nombre de bonnes réponses",s.qcmCorrect||0));
  s.qcmTotal=total;s.qcmCorrect=Math.min(total,Math.max(0,good||0));save()
}
function level(c){
  if(c.manual)return c.manual;
  const sc=c.sessions.filter(s=>s.qcmTotal>0).slice(-3).map(s=>s.qcmCorrect/s.qcmTotal*100);
  if(!sc.length)return "orange";
  const a=sc.reduce((x,y)=>x+y,0)/sc.length;
  if(a<50)return "red"; if(a<65)return "orange"; if(a<80)return "yellow"; if(a<95)return "green"; return "blue"
}
function setLevel(cid,v){data.courses.find(x=>x.id===cid).manual=v||null;save()}
function render(){
  subject.innerHTML=data.subjects.map(s=>`<option>${s}</option>`).join("");
  if(!j0.value)j0.value=today();

  const todays=[];
  data.courses.forEach(c=>c.sessions.forEach(s=>{if(s.date===today())todays.push({c,s})}));
  todayList.innerHTML=todays.length?todays.map(({c,s})=>`<div class="task ${s.done?"done":""}">
    <b>${c.title}</b> — ${c.subject}<br>${s.label}
    <div class="row" style="margin-top:6px">
      <button onclick="toggle('${c.id}','${s.id}')">${s.done?"Réouvrir":"✓ Fait"}</button>
      <button onclick="score('${c.id}','${s.id}')">QCM</button>
      <button onclick="addSession('${c.id}')">+ séance</button>
    </div>
  </div>`).join(""):"Aucune tâche aujourd’hui.";

  const d=new Date(); const day=d.getDay(); const diff=day===0?-6:1-day; const mon=new Date(d); mon.setDate(d.getDate()+diff);
  const dates=Array.from({length:7},(_,i)=>{let x=new Date(mon);x.setDate(mon.getDate()+i);return iso(x)});
  weekGrid.innerHTML=dates.map(ds=>{
    const items=[];data.courses.forEach(c=>c.sessions.forEach(s=>{if(s.date===ds)items.push({c,s})}));
    return `<div class="day"><b>${new Date(ds+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"})}</b><div>${items.map(({c,s})=>`<div class="task ${s.done?"done":""}">${c.title}<br>${s.label}</div>`).join("")||"—"}</div></div>`
  }).join("");

  courseList.innerHTML=data.courses.length?data.courses.map(c=>`<div class="task">
    <b>${c.title}</b> — ${c.subject}
    <div class="row" style="margin-top:6px"><button onclick="addSession('${c.id}')">+ séance</button></div>
  </div>`).join(""):"Aucun cours.";

  subjectTabs.innerHTML=data.subjects.map(s=>`<button class="${s===activeSubject?"primary":"secondary"}" onclick="activeSubject='${s}';render()">${s}</button>`).join("");
  const cs=data.courses.filter(c=>c.subject===activeSubject);
  subjectTable.innerHTML=`<table><tr><th>Niveau</th><th>Cours</th><th>Dernier score</th><th>Séances</th><th>Actions</th></tr>${
    cs.map(c=>{
      const qs=c.sessions.filter(s=>s.qcmTotal>0); const last=qs.at(-1); const lev=level(c);
      return `<tr><td><span class="badge ${lev}">${lev}</span></td><td><b>${c.title}</b></td><td>${last?last.qcmCorrect+"/"+last.qcmTotal:"—"}</td><td>${c.sessions.filter(s=>s.done).length}/${c.sessions.length}</td><td>
        <button onclick="addSession('${c.id}')">+ séance</button>
        <select onchange="setLevel('${c.id}',this.value)">
          <option value="">Auto</option><option value="red">Rouge</option><option value="orange">Orange</option><option value="yellow">Jaune</option><option value="green">Vert</option><option value="blue">Bleu</option>
        </select>
      </td></tr>`
    }).join("")
  }</table>`;
}
render()
</script>
</body>
</html>
